<body>
<canvas id="world" aria-label="Paisagem de um mundo de blocos"></canvas><div class="shade"></div>
<div class="topmark"><div class="mark-icon">▦</div><div><div class="mark-name">BLOCO A BLOCO</div><div class="mark-sub">SEU MUNDO, SUAS REGRAS</div></div></div>
<div class="profile"><div class="avatar">♟</div><span>Alex</span><span style="opacity:.65">⌄</span></div>
<main class="menu" id="menu">
<h1 class="game-title">MUNDO<br>ABERTO</h1><div class="edition">EDIÇÃO DE BLOCOS · 1.18.0</div>

<div class="hud" id="hud"><div class="hint" id="hint">WASD mover · Clique para minerar · Clique direito para colocar</div><div class="crosshair"></div><button class="exit-btn" id="exit">Ⅱ&nbsp; Menu</button><div class="status"><div class="hearts">♥ ♥ ♥ ♥ ♥</div><span id="coords">Floresta · x 0, z 0</span></div><div class="hotbar" id="hotbar"></div></div>

<script>
(()=>{'use strict';
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d'),menu=document.querySelector('#menu'),hud=document.querySelector('#hud'),panels=document.querySelector('#panels'),panel=document.querySelector('#panel'),mobile=document.querySelector('#mobile'),toastEl=document.querySelector('#toast');
let W=0,H=0,dpr=1,playing=false,worldSeed=1,selected=0,mode='menu',time=0,last=0,toastTimer=0;
const items=[{id:'grass',icon:'🟩',name:'Bloco de grama'},{id:'dirt',icon:'🟫',name:'Terra'},{id:'stone',icon:'⬜',name:'Pedra'},{id:'wood',icon:'🪵',name:'Tronco'},{id:'leaves',icon:'🌿',name:'Folhas'},{id:'sand',icon:'🟨',name:'Areia'},{id:'flower',icon:'🌼',name:'Flor'},{id:'water',icon:'🟦',name:'Água'},{id:'brick',icon:'🧱',name:'Tijolos'}];
let inventory=[24,18,12,8,7,10,5,0,0],world=new Map(),decor=[],particles=[],player={x:0,z:0,dx:0,dz:0,faceX:0,faceZ:1,bob:0};const keys={},camera={x:0,z:0},joystick={x:0,y:0,active:false};
function hash(x,z){let n=Math.sin((x+worldSeed*37)*127.1+(z-worldSeed*13)*311.7)*43758.5453;return n-Math.floor(n)}
function terrain(x,z){let n=hash(x,z),wave=Math.sin(x*.19+worldSeed)*.75+Math.cos(z*.16-worldSeed*.4)*.65;return Math.max(0,Math.min(3,Math.floor((wave+n*.8+1.6)/1.17)))}
function biome(x,z){const n=hash(Math.floor(x/7),Math.floor(z/7));return n<.12?'sand':n>.91?'stone':'grass'}
function key(x,z){return `${x},${z}`}
function blockAt(x,z){const k=key(x,z);if(world.has(k))return world.get(k);const h=terrain(x,z),b=biome(x,z);return {h,type:b==='sand'?(h?'sand':'sand'):b==='stone'?(h?'stone':'stone'):'grass',tree:false}}
function treeAt(x,z){const k=key(x,z);if(world.has(k))return world.get(k).tree||false;if(Math.abs(x)<4&&Math.abs(z)<4)return false;return hash(Math.floor(x/2),Math.floor(z/2))>.93&&hash(x+42,z-18)>.30&&biome(x,z)==='grass'}
function genDecor(){decor=[];for(let i=0;i<38;i++){const x=Math.round((hash(i+8,31)-.5)*32),z=Math.round((hash(i+51,67)-.5)*32);if(!treeAt(x,z)&&biome(x,z)==='grass')decor.push({x:x+.18,z:z+.23,type:hash(i,10)>.53?'flower':'grass'})}}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function project(x,z,y=0){const s=Math.min(W/30,H/17,48);return {x:W*.52+(x-camera.x-z+camera.z)*s*.5,y:H*.56+(x-camera.x+z-camera.z)*s*.25-y*s*.50,s}}
function rectPoly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function cube(x,z,h,type){const p=project(x,z,h),s=p.s,hh=s*.5,dx=s*.5,dy=s*.25,depth=s*.5;let top='#6cac43',left='#588c39',right='#47742f';if(type==='sand'){top='#e4cf7b';left='#bea75e';right='#a88e4c'}if(type==='stone'){top='#a4a8a2';left='#777d78';right='#626862'}if(type==='water'){top='#55aede';left='#367da9';right='#2f6d95'}if(type==='dirt'){top='#946a45';left='#765136';right='#62442f'}if(type==='leaves'){top='#4e8733';left='#39702e';right='#315d2b'}if(type==='flower'){top='#e5c54e';left='#b99838';right='#96752c'}if(type==='brick'){top='#a95643';left='#854035';right='#71342d'}if(type==='wood'){top='#b7894f';left='#805b35';right='#69482e'}
// soil sides
rectPoly([[p.x-dx,p.y],[p.x,p.y+dy],[p.x,p.y+dy+depth],[p.x-dx,p.y+depth]],left);rectPoly([[p.x,p.y+dy],[p.x+dx,p.y],[p.x+dx,p.y+depth],[p.x,p.y+dy+depth]],right);
if(type==='grass'){rectPoly([[p.x-dx,p.y-depth*.02],[p.x,p.y+dy-depth*.02],[p.x,p.y+dy+depth*.12],[p.x-dx,p.y+depth*.1]],'#4e8834');rectPoly([[p.x,p.y+dy-depth*.02],[p.x+dx,p.y-depth*.02],[p.x+dx,p.y+depth*.1],[p.x,p.y+dy+depth*.12]],'#41752c')}
rectPoly([[p.x,p.y-hh],[p.x+dx,p.y],[p.x,p.y+dy],[p.x-dx,p.y]],top);
if(type==='grass'){ctx.globalAlpha=.22;for(let i=0;i<4;i++){const a=p.x-dx+hash(x+i,z)*s,b=p.y-hh+hash(z+i,x)*dy;ctx.fillStyle=i%2?'#d1e586':'#234f28';ctx.fillRect(a,b,Math.max(1,s*.045),Math.max(1,s*.04))}ctx.globalAlpha=1}
}
function drawTree(x,z){const h=terrain(x,z),p=project(x,z,h),s=p.s;const trunk={x:p.x,y:p.y};rectPoly([[trunk.x-s*.08,trunk.y-s*.1],[trunk.x+s*.04,trunk.y-s*.03],[trunk.x+s*.04,trunk.y+s*.43],[trunk.x-s*.08,trunk.y+s*.36]],'#80572f');rectPoly([[trunk.x+s*.04,trunk.y-s*.03],[trunk.x+s*.15,trunk.y-s*.10],[trunk.x+s*.15,trunk.y+s*.35],[trunk.x+s*.04,trunk.y+s*.43]],'#654425');
for(let layer=0;layer<3;layer++){const cy=trunk.y-s*(.34+layer*.22),r=s*(.38-layer*.05);rectPoly([[p.x-r,cy],[p.x,cy-r*.38],[p.x+r,cy],[p.x,cy+r*.38]],layer===2?'#5c9a38':'#4c8732');rectPoly([[p.x-r,cy],[p.x,cy+r*.38],[p.x,cy+r*.82],[p.x-r,cy+r*.43]],'#39702e');rectPoly([[p.x,cy+r*.38],[p.x+r,cy],[p.x+r,cy+r*.43],[p.x,cy+r*.82]],'#315d2b');ctx.fillStyle='#78ad47';ctx.globalAlpha=.35;ctx.fillRect(p.x-r*.25,cy-r*.04,r*.34,r*.12);ctx.globalAlpha=1}}
function drawPlayer(){const p=project(player.x,player.z,terrain(Math.floor(player.x),Math.floor(player.z))),s=p.s,bob=Math.sin(player.bob)*s*.035;ctx.save();ctx.translate(p.x,p.y+bob); // shadow
ctx.fillStyle='#18211877';ctx.beginPath();ctx.ellipse(0,s*.19,s*.17,s*.085,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3687a5';ctx.fillRect(-s*.105,-s*.05,s*.21,s*.31);ctx.fillStyle='#275f78';ctx.fillRect(s*.015,-s*.05,s*.09,s*.31);ctx.fillStyle='#d4a47d';ctx.fillRect(-s*.10,-s*.27,s*.2,s*.19);ctx.fillStyle='#80543e';ctx.fillRect(-s*.11,-s*.30,s*.22,s*.065);ctx.fillStyle='#313432';ctx.fillRect(-s*.07,-s*.19,s*.025,s*.025);ctx.fillRect(s*.04,-s*.19,s*.025,s*.025);ctx.fillStyle='#514232';ctx.fillRect(-s*.095,s*.25,s*.08,s*.13);ctx.fillRect(s*.02,s*.25,s*.08,s*.13);ctx.fillStyle='#8c6544';ctx.fillRect(-s*.17,-s*.035,s*.065,s*.22);ctx.restore()}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#69b9e8');g.addColorStop(.58,'#b3dded');g.addColorStop(1,'#e7e4c2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const sx=W*.77,sy=H*.18;ctx.fillStyle='#fff4bf';ctx.beginPath();ctx.arc(sx,sy,Math.min(W,H)*.07,0,7);ctx.fill();ctx.fillStyle='#ffffff42';ctx.beginPath();ctx.arc(sx,sy,Math.min(W,H)*.095,0,7);ctx.fill();for(let i=0;i<7;i++){const x=((i*197+time*.7)%(W+180))-80,y=H*(.12+(i%3)*.10);ctx.fillStyle='#fff9';ctx.fillRect(x,y,58,14);ctx.fillRect(x+14,y-10,32,12);ctx.fillRect(x+44,y+2,29,10)}
// distant block hills
ctx.fillStyle='#82a994';ctx.beginPath();ctx.moveTo(0,H*.52);for(let x=0;x<=W;x+=40){ctx.lineTo(x,H*(.43+.06*Math.sin(x*.012)+.025*Math.cos(x*.023)))}ctx.lineTo(W,H*.66);ctx.lineTo(0,H*.66);ctx.fill();ctx.fillStyle='#77966c';ctx.fillRect(0,H*.59,W,H*.09)}
function drawScene(dt){time+=dt;drawSky();const radius=playing?12:13,cx=playing?player.x:0,cz=playing?player.z:0,tiles=[];for(let x=Math.floor(cx-radius);x<=cx+radius;x++)for(let z=Math.floor(cz-radius);z<=cz+radius;z++)tiles.push({x,z,d:x+z});tiles.sort((a,b)=>a.d-b.d);for(const t of tiles){const saved=world.get(key(t.x,t.z)),h=saved?saved.h:terrain(t.x,t.z),b=saved?saved.type:biome(t.x,t.z);cube(t.x,t.z,h,b);if(h>0&&hash(t.x+4,t.z-6)>.38){const p=project(t.x,t.z,h),s=p.s;ctx.fillStyle='#ffffff14';ctx.fillRect(p.x-s*.08,p.y-s*.35,s*.04,s*.04)}if(saved?saved.tree:treeAt(t.x,t.z))drawTree(t.x,t.z)}for(const d of decor){const p=project(d.x,d.z,terrain(Math.floor(d.x),Math.floor(d.z))),s=p.s;if(d.type==='flower'){ctx.fillStyle='#33733b';ctx.fillRect(p.x,p.y-s*.08,2,s*.14);ctx.fillStyle=hash(d.x,d.z)>.5?'#f4d45d':'#e98b8d';ctx.fillRect(p.x-3,p.y-s*.14,6,6)}else{ctx.fillStyle='#55944a';ctx.fillRect(p.x-4,p.y-s*.08,3,7);ctx.fillRect(p.x+1,p.y-s*.11,3,9)}}if(playing)drawPlayer();
// gentle vignette and pixel warmth
const v=ctx.createRadialGradient(W*.53,H*.48,H*.16,W*.5,H*.5,Math.max(W,H)*.78);v.addColorStop(0,'transparent');v.addColorStop(1,'#10180d66');ctx.fillStyle=v;ctx.fillRect(0,0,W,H)}
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing)update(dt);drawScene(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);
function startWorld(seed){worldSeed=seed??Math.floor(Math.random()*99999);world.clear();player={x:0,z:0,dx:0,dz:0,faceX:0,faceZ:1,bob:0};camera.x=0;camera.z=0;inventory=[24,18,12,8,7,10,5,0,0];selected=0;genDecor();playing=true;menu.classList.add('hidden');hud.classList.add('active');mobile.classList.add('show');panels.classList.remove('open');buildHotbar();showToast('Bem-vindo ao seu mundo!')}
function update(dt){let ax=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joystick.x,az=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joystick.y;const len=Math.hypot(ax,az);if(len>1){ax/=len;az/=len}player.dx+=(ax*.0-player.dx)*Math.min(1,dt*11);player.dz+=(az*.0-player.dz)*Math.min(1,dt*11);const speed=3.0;player.x+=ax*speed*dt;player.z+=az*speed*dt;player.bob+=len?dt*12:0;player.faceX=ax||player.faceX;player.faceZ=az||player.faceZ;camera.x+=(player.x-camera.x)*Math.min(1,dt*5);camera.z+=(player.z-camera.z)*Math.min(1,dt*5);document.querySelector('#coords').textContent=`Floresta · x ${Math.floor(player.x)}, z ${Math.floor(player.z)}`}
function buildHotbar(){const bar=document.querySelector('#hotbar');bar.innerHTML='';items.slice(0,9).forEach((it,i)=>{const slot=document.createElement('button');slot.className='slot'+(i===selected?' active':'');slot.innerHTML=`${it.icon}<small>${inventory[i]}</small>`;slot.title=it.name;slot.onclick=()=>selectSlot(i);bar.appendChild(slot)})}
function selectSlot(i){selected=i;document.querySelectorAll('.slot').forEach((e,n)=>e.classList.toggle('active',n===i))}
function rayTile(e){const rect=canvas.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top;let best=null,dist=Infinity;for(let x=Math.floor(player.x)-5;x<=player.x+5;x++)for(let z=Math.floor(player.z)-5;z<=player.z+5;z++){const p=project(x,z,terrain(x,z)),d=Math.hypot(p.x-mx,p.y+ p.s*.08-my);if(d<dist){dist=d;best={x,z}}}return dist<70?best:null}
function mineBlock(target){if(!playing)return;const t=target||{x:Math.round(player.x+player.faceX),z:Math.round(player.z+player.faceZ)};if(Math.hypot(t.x-player.x,t.z-player.z)>5)return showToast('Chegue mais perto do bloco!');const b=blockAt(t.x,t.z);const idx=items.findIndex(i=>i.id===b.type);if(idx>=0)inventory[idx]++;world.set(key(t.x,t.z),{h:Math.max(0,terrain(t.x,t.z)-1),type:'dirt',tree:false});buildHotbar();showToast(`${items[idx]?.name||'Bloco'} minerado`)}
function placeBlock(target){if(!playing)return;const t=target||{x:Math.round(player.x+player.faceX),z:Math.round(player.z+player.faceZ)};if(Math.hypot(t.x-player.x,t.z-player.z)>5)return showToast('Chegue mais perto para construir!');if(inventory[selected]<=0)return showToast('Você não tem esse bloco!');const item=items[selected];world.set(key(t.x,t.z),{h:terrain(t.x,t.z)+1,type:item.id,tree:false});inventory[selected]--;buildHotbar();showToast(`${item.name} colocado`)}
canvas.addEventListener('click',e=>{if(playing)mineBlock(rayTile(e))});canvas.addEventListener('contextmenu',e=>{e.preventDefault();if(playing)placeBlock(rayTile(e))});addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(k>='1'&&k<='9'&&playing)selectSlot(+k-1);if(k==='e'&&playing)openPanel('inventory')});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelector('#play').onclick=()=>openPanel('worlds');document.querySelector('#settings').onclick=()=>openPanel('settings');document.querySelector('#market').onclick=()=>openPanel('market');document.querySelector('#dressing').onclick=()=>openPanel('dressing');document.querySelector('#about').onclick=()=>openPanel('about');document.querySelector('#exit').onclick=()=>{playing=false;hud.classList.remove('active');mobile.classList.remove('show');menu.classList.remove('hidden')};
function closePanel(){panels.classList.remove('open')}panels.addEventListener('click',e=>{if(e.target===panels)closePanel()});function openPanel(type){panels.classList.add('open');let content='';if(type==='worlds')content=`<header class="panel-head"><div class="panel-title">Selecionar mundo</div><button class="close">×</button></header><div class="world-card"><div class="world-thumb">🌲</div><div class="world-info"><div class="world-name">Meu mundo incrível</div><div class="world-meta">Sobrevivência · Floresta · Atualizado agora</div></div><button class="small-btn" data-start="1">Jogar</button></div><div class="world-card"><div class="world-thumb">🏔️</div><div class="world-info"><div class="world-name">Novo mundo</div><div class="world-meta">Um lugar novinho em folha espera por você.</div></div><button class="small-btn" data-start="2">Jogar</button></div><div class="panel-actions"><button class="small-btn" data-start="new">＋ Criar novo mundo</button></div>`;
else if(type==='settings')content=`<header class="panel-head"><div class="panel-title">Configurações</div><button class="close">×</button></header><div class="setting"><label>Nome do jogador</label><input id="playerName" value="Alex" maxlength="14" style="width:150px;padding:8px;background:#414b43;color:white;border:1px solid #879188"></div><div class="setting"><label>Modo de jogo</label><select id="gameMode"><option>Sobrevivência</option><option>Criativo</option><option>Pacífico</option></select></div><div class="setting"><label>Campo de visão</label><input type="range" min="60" max="100" value="75"></div><div class="setting"><label>Música</label><button class="toggle on" data-toggle></button></div><div class="setting"><label>Exibir coordenadas</label><button class="toggle on" data-toggle></button></div><div class="panel-actions"><button class="small-btn" data-close>Concluído</button></div>`;
else if(type==='dressing')content=`<header class="panel-head"><div class="panel-title">Vestiário</div><button class="close">×</button></header><p>Escolha seu visual para a próxima aventura.</p><div class="skin-grid"><button class="skin selected">🧑🏻‍🌾</button><button class="skin">🧑🏽‍🚀</button><button class="skin">🧙🏻‍♀️</button><button class="skin">🧝🏾</button></div><div class="panel-actions"><button class="small-btn" data-close>Pronto</button></div>`;
else if(type==='market')content=`<header class="panel-head"><div class="panel-title">Loja de blocos</div><button class="close">×</button></header><div class="market-hero"><div style="font-size:44px">🌌</div><strong>Novos mundos para explorar</strong><span>Pacotes da comunidade · aventuras · visuais</span></div><div class="market-grid"><div class="market-tile">🏰<small>Castelos</small></div><div class="market-tile">🐉<small>Aventura</small></div><div class="market-tile">🌲<small>Natureza</small></div></div><div class="panel-actions"><button class="small-btn" data-close>Explorar</button></div>`;
else if(type==='inventory')content=`<header class="panel-head"><div class="panel-title">Inventário</div><button class="close">×</button></header><div class="skin-grid">${items.map((it,i)=>`<button class="skin" data-select="${i}" style="font-size:30px">${it.icon}<small style="font-size:12px">${inventory[i]}</small></button>`).join('')}</div>`;
else content=`<header class="panel-head"><div class="panel-title">Sobre</div><button class="close">×</button></header><p><strong>Bloco a Bloco · Edição 1.18.0</strong></p><p>Um pequeno mundo sandbox inspirado nos jogos de construção em blocos. Explore, mine e construa sua própria aventura.</p><p style="color:#c7d7c6">Controles: WASD para andar · Clique para minerar · Clique direito para colocar blocos · teclas 1–9 para trocar de bloco.</p><div class="panel-actions"><button class="small-btn" data-close>Entendi</button></div>`;
panel.innerHTML=content;panel.querySelectorAll('.close,[data-close]').forEach(b=>b.onclick=closePanel);panel.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startWorld(b.dataset.start==='new'?Math.floor(Math.random()*99999):Number(b.dataset.start)));panel.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));panel.querySelectorAll('.skin').forEach(b=>b.onclick=()=>{panel.querySelectorAll('.skin').forEach(s=>s.classList.remove('selected'));b.classList.add('selected')});panel.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selectSlot(+b.dataset.select);closePanel()})}
function showToast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1700)}
// Touch joystick and action controls
const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),max=r.width*.34,len=Math.hypot(dx,dy),scale=len>max?max/len:1;joystick.x=dx*scale/max;joystick.y=dy*scale/max;stick.style.transform=`translate(${dx*scale}px,${dy*scale}px)`}joy.addEventListener('pointerdown',e=>{joystick.active=true;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(joystick.active)joyMove(e)});function joyEnd(){joystick.active=false;joystick.x=0;joystick.y=0;stick.style.transform=''}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);document.querySelector('#mine').addEventListener('pointerdown',e=>{e.preventDefault();mineBlock()});document.querySelector('#place').addEventListener('pointerdown',e=>{e.preventDefault();placeBlock()});document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();player.bob+=1;showToast('Pulo!')});
})();
</script>
</body>
