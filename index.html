<script>
(()=>{

const W=1280,H=720, keys={}, hits=[];let screen='home', mode='EXIBIÇÃO', teamA=0,teamB=1, difficulty=1, sound=true, last=0, game=null, pointer=null;
const teams=[{name:'BRASIL',short:'BRA',color:'#f6d739',dark:'#15944f',rating:89},{name:'FRANÇA',short:'FRA',color:'#45a8ff',dark:'#183e9f',rating:87},{name:'ALEMANHA',short:'GER',color:'#f4f4ee',dark:'#db3438',rating:88},{name:'ESPANHA',short:'ESP',color:'#e84a45',dark:'#e5bd32',rating:86},{name:'ARGENTINA',short:'ARG',color:'#79d5ff',dark:'#f4f4ef',rating:85},{name:'ITÁLIA',short:'ITA',color:'#36a7f0',dark:'#f5f4e9',rating:84}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,size=18,color='#fff',align='left',font='Arial Black,Arial,sans-serif'){c.fillStyle=color;c.font=`900 ${size}px ${font}`;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y)}
function pixelText(s,x,y,size=16,color='#fff',align='left'){text(s,x,y,size,color,align,'monospace')}
function panel(x,y,w,h){rect(x+5,y+5,w,h,'#030810');rect(x,y,w,h,'#102033');rect(x+2,y+2,w-4,h-4,'#0a1626');rect(x+2,y+2,w-4,3,'#2d4258')}
function button(label,x,y,w,h,fn,sub='',color='#b8f334'){hits.push({x,y,w,h,fn});rect(x+4,y+4,w,h,'#030811');rect(x,y,w,h,'#293c4c');rect(x+2,y+2,w-4,h-4,'#122233');rect(x+2,y+2,5,h-4,color);pixelText(label,x+20,y+h/2-(sub?6:0),18,'#f4f7f2');if(sub)pixelText(sub,x+20,y+h/2+13,10,'#91a0ad');rect(x+w-16,y+12,5,5,color)}
function backButton(){button('VOLTAR',48,635,150,48,()=>screen='home','ESC PARA VOLTAR','#ffb43b')}
function stadium(){rect(0,0,W,H,'#07111d');rect(0,0,W,144,'#091625');for(let row=0;row<5;row++){for(let x=0;x<W;x+=12){let colors=['#263b4b','#5b3340','#c48b37','#267e73','#d3c591','#32546d'];rect(x+(row%2)*6,22+row*18,5,8,colors[(x*7+row*3)%colors.length])}}rect(0,112,W,10,'#213448');rect(0,124,W,14,'#102333');
// floodlights
for(let lx of [90,1190]){rect(lx-3,26,6,54,'#243648');rect(lx-25,18,50,12,'#bec9c0');for(let i=0;i<5;i++)rect(lx-21+i*10,20,5,5,'#fff5b0')}
// broad shadowed stadium below pitch
rect(0,625,W,95,'#08101a');for(let i=0;i<70;i++){let x=i*19;rect(x,636+(i%3)*13,10,7,['#233b4b','#9c4552','#d39939','#347a65'][i%4])}}
function drawLogo(x,y,scale=1){rect(x-34*scale,y-25*scale,68*scale,49*scale,'#b9ed34');rect(x-28*scale,y-19*scale,56*scale,37*scale,'#0a1726');text('14',x,y+1*scale,28*scale,'#d7f358','center');rect(x-24*scale,y+24*scale,48*scale,3*scale,'#f3bb47')}
function header(kicker,title){stadium();drawLogo(82,62,.7);pixelText(kicker,132,38,12,'#c7f34b');text(title,132,76,33,'#f5f5ec');rect(50,121,1180,2,'#456174');rect(50,125,180,4,'#b8ef35')}
function renderHome(){stadium(); // hero panel
rect(0,145,1280,480,'#0c1823');rect(690,145,590,480,'#102729');
// pixel pitch graphic on right
rect(760,188,430,344,'#287b42');for(let i=0;i<10;i++)rect(760+i*43,188,21,344,i%2?'#2d8846':'#287b42');rect(760,188,430,344,'#0000');c.strokeStyle='#e7edcc';c.lineWidth=3;c.strokeRect(780,204,390,310);c.beginPath();c.moveTo(975,205);c.lineTo(975,513);c.stroke();c.beginPath();c.arc(975,358,57,0,Math.PI*2);c.stroke();c.strokeRect(780,278,70,160);c.strokeRect(1100,278,70,160);rect(972,355,6,6,'#fff');
// chunky players
for(const [x,y,col] of [[864,314,'#f2d132'],[914,388,'#e5c92f'],[1018,329,'#e95348'],[1074,412,'#de4e48'],[1030,438,'#f6efe0'],[908,279,'#47aaf0']]){rect(x-5,y-12,12,16,col);rect(x-7,y+3,6,13,'#17263b');rect(x+1,y+3,6,13,'#17263b');rect(x-3,y-20,8,8,'#e0ad81')}
rect(988,366,9,9,'#f2eee1');
pixelText('EA SPORTS  •  FOOTBALL',72,179,12,'#afc0c6');text('FIFA',72,252,84,'#f7f7ed');text('14',300,252,84,'#bdf335');rect(77,294,485,3,'#2f4656');pixelText('PIXEL EDITION',78,326,16,'#bded3c');pixelText('O jogo bonito. Do seu jeito.',78,358,14,'#bdc9cb');
button('JOGAR AGORA',78,401,312,68,()=>screen='modes','ESCOLHA SEU MODO','#b9f334');button('OPÇÕES',78,489,190,52,()=>screen='settings','ÁUDIO E DIFICULDADE','#45b5ec');button('COMO JOGAR',281,489,190,52,()=>screen='controls','CONTROLES E DICAS','#ffb43b');
pixelText('EDIÇÃO ARCADE  •  TEMPORADA 2014',78,577,11,'#899aa2');rect(706,550,520,2,'#526e55');pixelText('11 CONTRA 11  /  PARTIDA RÁPIDA',720,579,12,'#d6edbd');pixelText('© PIXEL FOOTBALL CLUB',1198,668,10,'#566975','right')}
function renderModes(){header('MENU PRINCIPAL  /  JOGAR','ESCOLHA SEU MODO');panel(72,174,1136,424);pixelText('SELECIONE UMA EXPERIÊNCIA',104,211,12,'#a9b8bc');button('PARTIDA RÁPIDA',104,247,510,77,()=>{mode='EXIBIÇÃO';screen='setup'},'UM JOGO. DOIS TIMES. VOCÊ NO CONTROLE.','#b9f334');button('TORNEIO',650,247,510,77,()=>{mode='COPA PIXEL';screen='setup'},'LEVE SEU TIME ATÉ A FINAL.','#ffb43b');button('TREINO LIVRE',104,350,510,77,()=>{mode='TREINO';teamB=teamA===0?1:0;screen='setup'},'PRATIQUE CHUTES E PASSES SEM PRESSÃO.','#45b5ec');button('DESAFIO DE PÊNALTIS',650,350,510,77,()=>{mode='PÊNALTIS';screen='setup'},'DECIDA A PARTIDA NA MARCA DA CAL.','#f87969');pixelText('TODOS OS MODOS PODEM SER JOGADOS COM TECLADO OU TOQUE.',104,506,12,'#899ba3');backButton()}
function teamCard(i,x,y,selected){let t=teams[i];panel(x,y,284,174);rect(x+14,y+14,58,58,t.color);rect(x+14,y+43,58,29,t.dark);text(t.short,x+43,y+41,17,'#fff','center');pixelText(t.name,x+88,y+35,15,'#f3f5ef');pixelText(`ATAQUE  ${'▰'.repeat(Math.round(t.rating/10))}`,x+88,y+64,10,'#b9ef3c');pixelText(`RATING  ${t.rating}`,x+88,y+85,11,'#93a4ad');pixelText('◀',x+28,y+133,18,'#d7e4e6');pixelText('▶',x+251,y+133,18,'#d7e4e6','right');if(selected){rect(x+14,y+111,254,3,'#b9ef3c');pixelText('JOGADOR 1',x+141,y+137,11,'#c7f34b','center')}else pixelText('OPONENTE',x+141,y+137,10,'#8fa0a8','center')}
function renderSetup(){header('MODO  /  CONFIGURAR PARTIDA',mode);panel(72,168,1136,430);pixelText('ESCOLHA OS TIMES',103,198,12,'#b6c3c6');teamCard(teamA,103,220,true);teamCard(teamB,893,220,false);
button('TIME ANTERIOR',103,414,284,48,()=>teamA=(teamA+teams.length-1)%teams.length,'JOGADOR 1','#45b5ec');button('PRÓXIMO TIME',103,476,284,48,()=>teamA=(teamA+1)%teams.length,'JOGADOR 1','#45b5ec');button('TIME ANTERIOR',893,414,284,48,()=>teamB=(teamB+teams.length-1)%teams.length,'CPU','#ffb43b');button('PRÓXIMO TIME',893,476,284,48,()=>teamB=(teamB+1)%teams.length,'CPU','#ffb43b');
rect(475,250,330,210,'#0b1722');rect(489,264,302,181,'#287b42');for(let i=0;i<6;i++)rect(489+i*51,264,25,181,i%2?'#2e8847':'#287b42');c.strokeStyle='#e6edce';c.lineWidth=2;c.strokeRect(500,274,280,161);c.beginPath();c.moveTo(640,274);c.lineTo(640,435);c.stroke();c.beginPath();c.arc(640,354,30,0,Math.PI*2);c.stroke();text('VS',640,356,28,'#fff','center');
pixelText(`${teams[teamA].short}  ×  ${teams[teamB].short}`,640,480,15,'#e8f4e1','center');button('INICIAR PARTIDA',436,526,408,54,()=>startMatch(),'APITO INICIAL  •  ENTER','#b9f334');backButton()}
function renderSettings(){header('MENU PRINCIPAL  /  PREFERÊNCIAS','OPÇÕES');panel(170,178,940,407);pixelText('AJUSTE A SUA EXPERIÊNCIA',208,220,12,'#abb8bd');pixelText('DIFICULDADE',222,282,16,'#edf2e8');button('◀',560,253,70,56,()=>difficulty=(difficulty+2)%3,'','#ffb43b');pixelText(['AMADOR','PROFISSIONAL','LENDÁRIO'][difficulty],744,281,15,'#c2f34a','center');button('▶',853,253,70,56,()=>difficulty=(difficulty+1)%3,'','#ffb43b');rect(220,326,840,2,'#304352');pixelText('EFEITOS SONOROS',222,381,16,'#edf2e8');button(sound?'LIGADO':'DESLIGADO',690,351,230,58,()=>sound=!sound,'CLIQUE PARA ALTERNAR',sound?'#b9f334':'#ffb43b');pixelText('O jogo funciona sem áudio. O estádio continua vibrando!',222,449,12,'#8fa1a8');pixelText('MODO ARCADE  •  90 SEGUNDOS DE PARTIDA',222,503,11,'#748791');backButton()}
function renderControls(){header('MENU PRINCIPAL  /  GUIA','COMO JOGAR');panel(102,169,1076,445);pixelText('NO CAMPO',142,209,12,'#b9ef3c');const rows=[['W A S D  /  SETAS','Mover o jogador'],['ESPAÇO','Chutar ao gol'],['Q','Passe para o companheiro'],['SHIFT','Correr (consome fôlego)'],['E','Trocar jogador'],['ESC / P','Pausar ou voltar']];rows.forEach((r,i)=>{pixelText(r[0],153,258+i*48,15,'#f2f4ed');pixelText(r[1],470,258+i*48,14,'#a8b7bd');if(i<rows.length-1)rect(144,281+i*48,973,1,'#243849')});pixelText('NO CELULAR OU TABLET',142,568,11,'#ffb43b');pixelText('Use o direcional e os botões na tela durante a partida.',360,568,12,'#b0bdc1');backButton()}
function newPlayer(team,x,y,keeper=false){return{x,y,vx:0,vy:0,r:keeper?11:9,team,keeper,stamina:100,flash:0}}
function startMatch(){const a=teamA,b=teamB;let home=[],away=[];for(let i=0;i<6;i++){home.push(newPlayer(0,250+(i%2)*100,225+Math.floor(i/2)*94));away.push(newPlayer(1,1030-(i%2)*90,225+Math.floor(i/2)*94))}home[0].keeper=true;home[0].x=143;home[0].y=358;away[0].keeper=true;away[0].x=1137;away[0].y=358;game={home,away,ball:{x:640,y:360,vx:0,vy:0,r:6,owner:null},score:[0,0],time:90,elapsed:0,selected:1,paused:false,ended:false,mode,teamA:a,teamB:b,lastScorer:-1,message:'',messageTimer:0,stamina:100,penalty:mode==='PÊNALTIS'};screen='game';last=performance.now()}
function actorList(){return game?game.home.concat(game.away):[]}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearestPlayer(team,x,y,includeKeeper=false){let list=team===0?game.home:game.away;let best=null,d=1e9;for(const p of list){if(p.keeper&&!includeKeeper)continue;const z=Math.hypot(p.x-x,y-p.y);if(z<d){best=p;d=z}}return best}
function kick(p,angle,power=330){if(!game)return;let b=game.ball;b.owner=null;b.x=p.x;b.y=p.y;b.vx=Math.cos(angle)*power;b.vy=Math.sin(angle)*power;game.message='';}
function tryShoot(){if(!game||game.paused||game.ended)return;const p=game.home[game.selected];if(game.ball.owner&&game.ball.owner.team===0){kick(p,Math.atan2(360-p.y,1168-p.x),440);return}if(dist(p,game.ball)<30){kick(p,Math.atan2(360-p.y,1168-p.x),440)}}
function tryPass(){if(!game||game.paused||game.ended)return;const p=game.home[game.selected];if(game.ball.owner?.team!==0&&dist(p,game.ball)>22)return;let mate=game.home.filter(q=>q!==p&&!q.keeper).sort((a,b)=>b.x-a.x)[0];if(mate)kick(p,Math.atan2(mate.y-p.y,mate.x-p.x),300)}
function switchPlayer(){if(!game)return;let b=game.ball;let n=nearestPlayer(0,b.x,b.y);if(n)game.selected=game.home.indexOf(n)}
function controls(){let dx=0,dy=0;if(keys.ArrowLeft||keys.a||pointer?.left)dx--;if(keys.ArrowRight||keys.d||pointer?.right)dx++;if(keys.ArrowUp||keys.w||pointer?.up)dy--;if(keys.ArrowDown||keys.s||pointer?.down)dy++;return {dx,dy}}
function update(dt){if(screen!=='game'||!game||game.paused||game.ended)return;dt=Math.min(dt,.04);let g=game,b=g.ball;g.elapsed+=dt;if(!g.penalty)g.time=Math.max(0,g.time-dt);if(g.time===0){g.ended=true;g.message=g.score[0]===g.score[1]?'EMPATE!':'FIM DE JOGO';return}
let controlled=g.home[g.selected],input=controls(),mag=Math.hypot(input.dx,input.dy);if(mag){input.dx/=mag;input.dy/=mag}let sprint=!!(keys.Shift||pointer?.sprint),speed=sprint&&g.stamina>0?218:152;g.stamina=clamp(g.stamina+(sprint&&mag?-25:12)*dt,0,100);controlled.vx=input.dx*speed;controlled.vy=input.dy*speed;controlled.x+=controlled.vx*dt;controlled.y+=controlled.vy*dt;
for(let i=0;i<g.home.length;i++){let p=g.home[i];if(p===controlled)continue;let targetX=340+(i%2)*62,targetY=225+Math.floor(i/2)*83;if(b.owner?.team===1){targetX=clamp(b.x-150,220,570);targetY=clamp(b.y+(i%2?70:-70),195,565)}else if(b.owner?.team===0){targetX=clamp(b.x+80,300,800);targetY=clamp(b.y+(i%2?65:-65),190,575)}p.x+=(targetX-p.x)*dt*.48;p.y+=(targetY-p.y)*dt*.48}
for(let i=0;i<g.away.length;i++){let p=g.away[i];if(p.keeper){let ty=clamp(b.y,292,428);p.y+=(ty-p.y)*dt*.55;continue}let targetX=clamp(b.x+45,620,1040),targetY=b.y+(i%2?50:-50);if(b.owner?.team===1){targetX=clamp(1000-i*16,680,1080);targetY=clamp(b.y+(i%2?64:-64),185,580)}p.x+=(targetX-p.x)*dt*[.34,.52,.8][difficulty];p.y+=(targetY-p.y)*dt*[.34,.52,.8][difficulty]}
for(const p of actorList()){p.x=clamp(p.x,126,1154);p.y=clamp(p.y,161,608)}
if(b.owner?.team===1&&mag&&dist(controlled,b)<22){b.owner=controlled;g.message='';}
if(b.owner){let p=b.owner;if(p.team===0&&p===controlled){b.x=p.x+11;b.y=p.y+2}else if(p.team===1){b.x=p.x-11;b.y=p.y+2;if(Math.random()<dt*(difficulty===0?.12:.35)){kick(p,Math.atan2(360-p.y,115-p.x),difficulty===2?350:290)}}}else{b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=Math.pow(.985,dt*60);b.vy*=Math.pow(.985,dt*60);if(b.y<156||b.y>613)b.vy*=-.75;b.y=clamp(b.y,156,613);if(Math.hypot(b.vx,b.vy)<19)b.vx=b.vy=0;
if(b.x<108&&b.y>302&&b.y<418){g.score[1]++;goal(1)}else if(b.x>1172&&b.y>302&&b.y<418){g.score[0]++;goal(0)}else{if(b.x<118||b.x>1162)b.vx*=-.75;b.x=clamp(b.x,112,1168);let candidates=actorList().filter(p=>!p.keeper);for(const p of candidates){if(dist(p,b)<p.r+b.r+4&&Math.hypot(b.vx,b.vy)<155){b.owner=p;break}}}}
if(g.messageTimer>0)g.messageTimer-=dt}
function goal(side){let g=game;g.lastScorer=side;g.message=side===0?teams[g.teamA].name+'  GOL!':teams[g.teamB].name+'  GOL!';g.messageTimer=2.2;g.ball.x=640;g.ball.y=360;g.ball.vx=g.ball.vy=0;g.ball.owner=null;for(let p of actorList()){if(p.team===0){p.x=300+(p.x%90);p.y=210+(p.y%160)}else{p.x=930-(p.x%70);p.y=230+(p.y%150)}}}
function field(){rect(0,0,W,H,'#07111d');rect(54,48,1172,621,'#101d2a');for(let i=0;i<8;i++)rect(90+i*141,127,141,510,i%2?'#2b8242':'#28793d');rect(90,127,1128,510,'#0000');c.strokeStyle='#e7e9cc';c.lineWidth=3;c.strokeRect(90,127,1128,510);c.beginPath();c.moveTo(654,127);c.lineTo(654,637);c.stroke();c.beginPath();c.arc(654,382,76,0,Math.PI*2);c.stroke();rect(650,378,8,8,'#fff');c.strokeRect(90,273,153,218);c.strokeRect(1065,273,153,218);c.strokeRect(90,326,48,112);c.strokeRect(1170,326,48,112);c.beginPath();c.arc(214,382,4,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.beginPath();c.arc(1094,382,4,0,Math.PI*2);c.fill();c.strokeRect(67,330,24,104);c.strokeRect(1218,330,24,104);
// subtle pitch pixel texture
for(let i=0;i<90;i++){let x=100+(i*137)%1100,y=140+(i*71)%480;rect(x,y,2,2,'#ffffff14')}
}
function drawPlayer(p,index){let t=p.team===0?teams[game.teamA]:teams[game.teamB];let x=Math.round(p.x),y=Math.round(p.y);rect(x-9,y+8,18,4,'#10232177');if(p===game.home[game.selected]){rect(x-13,y-23,26,2,'#d7f44d');rect(x-2,y-29,4,4,'#d7f44d')}rect(x-6,y-4,5,12,'#172841');rect(x+1,y-4,5,12,'#172841');rect(x-9,y-14,18,14,p.keeper?'#f7f6ec':t.color);rect(x-9,y-14,18,3,t.dark);rect(x-3,y-12,6,5,'#fff');rect(x-4,y-22,8,8,'#dca77c');if(p.keeper){rect(x-10,y-3,20,3,'#f2cd3a')};if(game.home.indexOf(p)!==-1&&p===game.home[game.selected])pixelText('1',x,y+1,7,'#102033','center')}
function clockString(t){let n=Math.ceil(t);return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function touchButton(label,x,y,w,h,key,color){hits.push({x,y,w,h,key,fn:()=>{if(key==='shoot')tryShoot();else if(key==='pass')tryPass();else if(key==='switch')switchPlayer();else if(key==='pause')game.paused=!game.paused}});rect(x+3,y+3,w,h,'#030810');rect(x,y,w,h,'#40505a');rect(x+2,y+2,w-4,h-4,'#112233');rect(x+2,y+2,w-4,4,color);pixelText(label,x+w/2,y+h/2,11,'#f3f5ea','center')}
function renderGame(){field();const g=game;for(let p of g.home)drawPlayer(p);for(let p of g.away)drawPlayer(p);let b=g.ball;rect(b.x-6,b.y-5,13,11,'#14231e');rect(b.x-5,b.y-6,10,10,'#f0eee3');rect(b.x-2,b.y-4,4,4,'#1c2633');rect(b.x+2,b.y+1,3,3,'#1c2633');
// scoreboard ribbon

function render(){hits.length=0;c.clearRect(0,0,W,H);if(screen==='home')renderHome();else if(screen==='modes')renderModes();else if(screen==='setup')renderSetup();else if(screen==='settings')renderSettings();else if(screen==='controls')renderControls();else if(screen==='game')renderGame()}
function coords(e){if(matchMedia('(orientation: portrait)').matches){let scale=innerHeight/W;return{x:640+(e.clientY-innerHeight/2)/scale,y:360-(e.clientX-innerWidth/2)/scale}}let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function pointerDown(e){e.preventDefault();canvas.setPointerCapture?.(e.pointerId);let p=coords(e);if(screen==='game'&&!game.paused&&!game.ended){let h=hits.find(q=>p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h);if(h?.key){if(['up','down','left','right'].includes(h.key))pointer={...(pointer||{}),[h.key]:true};else h.fn();return}}
let h=hits.find(q=>p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h);if(h)h.fn()}
function pointerMove(e){if(!pointer||screen!=='game')return;let p=coords(e);let h=hits.find(q=>q.key&&['up','down','left','right'].includes(q.key)&&p.x>=q.x&&p.x<=q.x+q.w&&p.y>=q.y&&p.y<=q.y+q.h);for(let k of ['up','down','left','right'])pointer[k]=!!(h&&h.key===k)}
function pointerUp(){pointer=null}
canvas.addEventListener('pointerdown',pointerDown);canvas.addEventListener('pointermove',pointerMove);canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);canvas.addEventListener('contextmenu',e=>e.preventDefault());
