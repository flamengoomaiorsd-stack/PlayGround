<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#07070a" />
<meta name="description" content="Ashes of Olympus - um menu e jogo de arena em pixel art inspirado em God of War III." />
<title>ASHES OF OLYMPUS · Pixel Epic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307070a'/%3E%3Cpath d='M6 24 L26 8 M6 8 L26 24' stroke='%23d9ab5c' stroke-width='3'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="game" width="480" height="270" aria-label="Jogo em pixel art: menu e arena de combate"></canvas>
      <div id="crt" aria-hidden="true"></div>
    </div>
    <div id="touch" aria-hidden="true">
      <button class="tbtn pause-btn" data-action="pause" aria-label="Pausar">II</button>
      <div class="pad">
        <button class="tbtn dpad" data-action="left" aria-label="Esquerda">&#9664;</button>
        <button class="tbtn dpad" data-action="right" aria-label="Direita">&#9654;</button>
      </div>
      <div class="actions">
        <button class="tbtn round small" data-action="dash" aria-label="Esquiva">ESQ</button>
        <button class="tbtn round small" data-action="rage" aria-label="Fúria">IRA</button>
        <button class="tbtn round" data-action="jump" aria-label="Saltar">SAL</button>
        <button class="tbtn round big" data-action="attack" aria-label="Atacar">ATQ</button>
      </div>
    </div>
    <p id="sr-help" class="sr-only">Use setas ou WASD para mover, Espaço para saltar, J para atacar, K para golpe pesado, L para fúria, Shift para esquiva e Esc para pausar. No menu, use as setas e Enter.</p>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
